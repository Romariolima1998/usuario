global:
  scrape_interval: 15s # O tempo que ele espera para ler os dados do Java

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
      # 172.17.0.1 é o IP padrão do gateway do Docker no Ubuntu.
      # Ele aponta para o seu "localhost" de fora do container.
      # no terminal   ip addr show docker0