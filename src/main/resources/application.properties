spring.application.name=usuario
spring.threads.virtual.enabled=true

# URL de conexão com o banco
spring.datasource.url=jdbc:postgresql://localhost:5432/db_usuario

viacep.url=https://viacep.com.br

# Usuário e senha do PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=1998

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

# Dialeto para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# spring boot actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.tracing.sampling.probability=1.0
#management.endpoints.web.exposure.include=health,info,prometheus,metrics

# --------------------------------------------para gerar sql-------------------------------------------
# Faz o Hibernate imprimir o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Faz o Hibernate gerar um arquivo com todo o SQL das suas Entities
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/rascunho_db.sql
